# Pubblica il sito su GitHub Pages a ogni push su main.
#
# Sostituisce la pubblicazione «dal branch» di Pages, che ha un limite indicativo di 10
# ricostruzioni l'ora: la sera del voto gli exit poll in stime.json (ed eventualmente la copia
# del feed in dati/live/) si pubblicano più spesso. Con un workflow il limite non c'è.
# Se arrivano più push di fila, vince l'ultimo: quelli in corso si annullano.
name: Pubblica il sito
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
