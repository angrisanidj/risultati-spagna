# Scarica un pacchetto di dati storici dal Ministero dell'Interno (infoelectoral) e lo lascia
# come artefatto del job. Serve perché infoelectoral.interior.gob.es non risponde da tutte le
# reti: dai server di GitHub sì. Si lancia a mano: Actions → Dati storici del Ministero → Run
# workflow, con il nome del file (per esempio 02202307_MUNI.zip, il Congresso del 2023 per comune).
# Poi: gh run download <id> -n infoelectoral
name: Dati storici del Ministero
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Nome del pacchetto in estaticos/docxl/apliextr/'
        required: true
        default: '02202307_MUNI.zip'
permissions:
  contents: read
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica
        env:
          FILE: ${{ inputs.file }}
        run: |
          case "$FILE" in *[!A-Za-z0-9_.-]*) echo "nome non valido"; exit 1;; esac
          mkdir out
          curl -sS -f -L -m 300 -A 'Mozilla/5.0' -o "out/$FILE" "https://infoelectoral.interior.gob.es/estaticos/docxl/apliextr/$FILE"
          ls -la out
          unzip -l "out/$FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: infoelectoral
          path: out/
          retention-days: 7
